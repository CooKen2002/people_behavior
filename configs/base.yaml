pose_skeleton:
  [
    [16, 14],   # Mắt cá chân phải -> Đầu gối phải  
    [14, 12],   # Đầu gối phải -> Hông phải  
    [17, 15],   # Mắt cá chân trái -> Đầu gối trái (1-indexed hoặc 0-indexed tùy code vẽ)  
    [15, 13],   # Đầu gối trái -> Hông trái  
    [12, 13],   # Hông phải -> Hông trái  
    [6, 12],    # Vai phải -> Hông phải  
    [5, 11],    # Vai trái -> Hông trái  
    [5, 6],     # Vai trái -> Vai phải
    [6, 8],     # Vai phải -> Khuỷu tay phải
    [8, 10],    # Khuỷu tay phải -> Cổ tay phải  
    [5, 7],     # Vai trái -> Khuỷu tay trái
    [7, 9],     # Khuỷu tay trái -> Cổ tay trái
    [1, 2],     # Mắt trái -> Mắt phải
    [0, 1],     # Mũi -> Mắt trái
    [0, 2],     # Mũi -> Mắt phải
    [1, 3],     # Mắt trái -> Tai trái
    [2, 4],     # Mắt phải -> Tai phải
  ]